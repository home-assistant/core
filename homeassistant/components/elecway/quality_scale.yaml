rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register additional actions.
  appropriate-polling:
    status: exempt
    comment: Measurements are pushed over a local WebSocket.
  brands:
    status: todo
    comment: The Elecway icon and logo are pending inclusion in the brands repository.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: >-
      aioelecway 0.1.1 is published on PyPI under Apache-2.0.
      The public v0.1.1 tag and publish.yml workflow are available at
      https://github.com/Elecway001/aioelecway-ha.
  docs-actions:
    status: exempt
    comment: The integration does not register additional actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide custom conditions.
  docs-triggers:
    status: exempt
    comment: The integration does not provide custom triggers.
  docs-high-level-description: done
  docs-installation-instructions:
    status: done
    comment: The companion page includes prerequisites and the config flow instructions.
  docs-removal-instructions:
    status: done
    comment: The companion page includes the standard integration removal instructions.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
