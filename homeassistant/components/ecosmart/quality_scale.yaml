rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service action.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any service action.
  docs-conditions:
    status: exempt
    comment: This integration does not register any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not register any triggers.
  entity-event-setup:
    status: exempt
    comment: Entities are coordinator driven and subscribe to no external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any service action.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: This is a cloud service with no network discovery.
  discovery:
    status: exempt
    comment: This is a cloud service with no network discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class:
    status: exempt
    comment: >-
      Home Assistant has no device class for an energy price, and the monetary
      class does not fit a rate in cents per kilowatt hour.
  entity-disabled-by-default:
    status: exempt
    comment: Both entities are the point of the integration; neither is noisy.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: No repairable condition exists that the user could act on.
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
