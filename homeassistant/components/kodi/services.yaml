# Describes the format for available Kodi services

add_to_playlist:
  target:
    entity:
      integration: kodi
      domain: media_player
  fields:
    media_type:
      required: true
      example: ALBUM
      selector:
        text:
    media_id:
      example: 123456
      selector:
        text:
    media_name:
      example: "Highway to Hell"
      selector:
        text:
    artist_name:
      example: "AC/DC"
      selector:
        text:

call_method:
  target:
    entity:
      integration: kodi
      domain: media_player
  fields:
    method:
      required: true
      example: "VideoLibrary.GetRecentlyAddedEpisodes"
      selector:
        text:

send_message:
  target:
    entity:
      integration: kodi
      domain: notify
  fields:
    message:
      required: true
      example: "The front door was opened."
      selector:
        text:
    title:
      example: "Front door"
      selector:
        text:
    icon:
      default: info
      selector:
        select:
          options:
            - info
            - warning
            - error
          custom_value: true
          translation_key: icon
    displaytime:
      default: 10000
      selector:
        number:
          min: 1500
          max: 600000
          step: 500
          unit_of_measurement: ms
          mode: box
