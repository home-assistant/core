rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not provide actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: The integration uses only the standard library.
  docs-actions:
    status: exempt
    comment: The integration does not provide actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: The entities are polled and do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: The entities are polled and report unavailable if the server is unreachable.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not provide actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: The integration does not use authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: The TCP server cannot be discovered.
  discovery:
    status: exempt
    comment: The TCP server cannot be discovered.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration connects to any generic TCP server, not to specific devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  dynamic-devices:
    status: exempt
    comment: Each config entry creates a single device.
  entity-category:
    status: exempt
    comment: The entities are the primary entities of the device.
  entity-device-class:
    status: exempt
    comment: The value comes from a generic TCP server, so no device class applies.
  entity-disabled-by-default:
    status: exempt
    comment: The entities are the primary entities of the device.
  entity-translations:
    status: exempt
    comment: The entities use the device name and have no translatable name.
  exception-translations:
    status: exempt
    comment: The integration does not raise exceptions to the user.
  icon-translations:
    status: exempt
    comment: The entities do not use custom icons.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: The only issue is the temporary YAML deprecation, which needs no repair flow.
  stale-devices:
    status: exempt
    comment: Each config entry creates a single device.

  # Platinum
  async-dependency: todo
  inject-websession:
    status: exempt
    comment: The integration does not use HTTP.
  strict-typing: todo
