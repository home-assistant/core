rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling:
    status: exempt
    comment: Integration does not poll.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not register custom actions.
  docs-conditions:
    status: exempt
    comment: Integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not register custom actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: Service can't be discovered.
  discovery:
    status: exempt
    comment: Service can't be discovered.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: Integration connects to a service, not devices.
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Devices are created from subentries.
  entity-category:
    status: exempt
    comment: The conversation entity has no entity category.
  entity-device-class:
    status: exempt
    comment: The conversation entity has no device class.
  entity-disabled-by-default:
    status: exempt
    comment: The conversation entity is the primary entity.
  entity-translations:
    status: exempt
    comment: The conversation entity is named after its device.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: The conversation entity has no custom icon.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: Integration has no repair issues.
  stale-devices:
    status: exempt
    comment: Devices are removed together with their subentry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
