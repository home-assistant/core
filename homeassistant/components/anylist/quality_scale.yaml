rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide custom actions.
  appropriate-polling:
    status: exempt
    comment: AnyList pushes invalidations over a WebSocket connection.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide custom actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: Realtime updates are dispatched through the coordinator, not per-entity subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not provide an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices:
    status: exempt
    comment: AnyList is a service integration and does not expose devices.
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: AnyList is a cloud service and does not discover devices.
  discovery:
    status: exempt
    comment: AnyList is a cloud service and does not discover devices.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: AnyList is a service integration and does not expose devices.
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: AnyList exposes lists, not devices.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: All exposed entities are primary user shopping lists; there are no noisy or secondary entities to disable by default.
  entity-translations: todo
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: AnyList exposes lists, not devices.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
