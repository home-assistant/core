rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: |
      The serial-to-Modbus-TCP bridge can take longer than Home Assistant's
      setup budget to answer. Entities are created unavailable and the
      coordinators retry in the background instead of blocking startup.
  unique-config-entry: done
  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: A Modbus link has no authentication.
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Modbus links are not discoverable.
  discovery-update-info:
    status: exempt
    comment: Modbus links are not discoverable.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: This integration always represents exactly one fixed device.
  entity-category:
    status: done
    comment: |
      Diagnostic: device identifiers (software_version, device_type,
      zentralgeraet_adresse), 9 presence/"_vorhanden" binary_sensors, and 18
      fault/timeout binary_sensors (Störung*/timeout_*) -- consistent with
      Platinum-tier precedent (shelly, unifiprotect mark PROBLEM-class
      binary_sensors diagnostic). Config: all 10 writable number setpoints
      and both boost-function switches -- matches the CONFIG example in the
      HA dev docs (a switch enabling a function). Everything else (state/
      operating-hour/runtime sensors, demand/"Anforderung" flags, the
      Betriebsart mode select) stays regular, matching how Platinum-tier
      tplink leaves analogous runtime/remaining-life sensors uncategorized.
  entity-device-class:
    status: done
    comment: |
      sensor.py already used TEMPERATURE/DURATION throughout. Added
      BinarySensorDeviceClass.PROBLEM to the 18 fault/timeout binary_sensors
      and NumberDeviceClass.TEMPERATURE to the two °C setpoints; the
      remaining number/switch/select entities have no fitting device class
      (plain counts, percentages, minutes, or a manufacturer-defined enum).
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: done
    comment: |
      icons.json covers every entity lacking a device-class-derived icon
      (following Platinum-tier duco's precedent of targeted, not exhaustive,
      coverage) -- presence/"_vorhanden" and fault-adjacent binary_sensors,
      unitless/flow/pressure sensors, both boost-function switches, and the
      Betriebsart select. Per-option select state icons aren't possible: the
      option labels are free-text German strings, and icons.json state keys
      must match ``[a-z0-9-_]+``.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No repairable issues are raised.
  stale-devices:
    status: exempt
    comment: This integration always represents exactly one fixed device.
  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: This integration talks Modbus, not HTTP.
  strict-typing: done
