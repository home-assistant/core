rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not expose any custom service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not expose any custom service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not expose any custom service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: The integration logs a single message when the EnergyID service is unavailable.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics:
    status: todo
    comment: Diagnostics will be added in a follow-up PR to help with debugging.
  discovery:
    status: exempt
    comment: Configuration requires manual entry of provisioning credentials.
  discovery-update-info:
    status: exempt
    comment: No discovery mechanism is used.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: This is a service integration not tied to specific device models.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: The integration creates one static service device per config entry.
  entity-category:
    status: exempt
    comment: Directive sensors are primary user-facing entities.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Each directive is a primary user-facing signal.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: The directive enum sensor uses the default sensor icon.
  reconfiguration-flow:
    status: todo
    comment: Reconfiguration will be added in a follow-up PR to allow updating the device name.
  repair-issues:
    status: exempt
    comment: Authentication issues are handled via the reauthentication flow.
  stale-devices:
    status: exempt
    comment: Creates a single service device entry tied to the config entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
