rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing beyond the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any service actions and only has sensors.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not have an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: The stove requires no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry manages a single stove.
  entity-category:
    status: exempt
    comment: All entities are primary readings of the stove.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The integration only creates the four main readings of the stove.
  entity-translations: done
  exception-translations: todo
  icon-translations:
    status: exempt
    comment: The entities do not use custom icons.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: |
      Nothing the user can act on can go wrong beyond the stove being unreachable,
      which the entities already report as unavailable.
  stale-devices:
    status: exempt
    comment: Each config entry manages a single stove.

  # Platinum
  async-dependency: done
  inject-websession: todo
  strict-typing: done
