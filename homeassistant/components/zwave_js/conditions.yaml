# Describes the format for available Z-Wave JS conditions

.target: &target
  entity:
    - integration: zwave_js
  device:
    - integration: zwave_js
  primary_entities_only: false

.behavior: &behavior
  required: true
  default: any
  selector:
    automation_behavior:
      mode: condition

.value: &value
  required: true
  example: 255
  selector:
    object:

node_status:
  target: *target
  fields:
    behavior: *behavior
    status:
      required: true
      selector:
        select:
          translation_key: node_status
          options:
            - alive
            - asleep
            - awake
            - dead

config_parameter:
  target: *target
  fields:
    behavior: *behavior
    parameter:
      required: true
      example: 3
      selector:
        number:
          min: 0
          mode: box
    bitmask:
      required: false
      example: "0x1"
      selector:
        text:
    endpoint:
      required: false
      default: 0
      selector:
        number:
          min: 0
          mode: box
    value: *value

