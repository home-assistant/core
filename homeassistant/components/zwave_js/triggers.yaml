# Describes the format for available Z-Wave JS triggers

.device_id: &device_id
  required: false
  example: 8f4219cfa57e23f6f669c4616c2205e2
  selector:
    device:
      filter:
        - integration: zwave_js
      multiple: true

.entity_id: &entity_id
  required: false
  example: sensor.living_room_temperature
  selector:
    entity:
      filter:
        - integration: zwave_js
      multiple: true

.node_status_list: &node_status_list
  required: false
  selector:
    select:
      translation_key: node_status
      multiple: true
      options:
        - alive
        - asleep
        - awake
        - dead

event:
  fields:
    event_source:
      required: true
      selector:
        select:
          translation_key: event_source
          options:
            - controller
            - driver
            - node
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: zwave_js
    device_id: *device_id
    entity_id: *entity_id
    event:
      required: true
      example: value notification
      selector:
        text:
    event_data:
      required: false
      selector:
        object:
    partial_dict_match:
      required: false
      default: false
      selector:
        boolean:

node_status:
  target:
    entity:
      - integration: zwave_js
        domain: sensor
    device:
      - integration: zwave_js
    primary_entities_only: false
  fields:
    behavior:
      required: true
      default: each
      selector:
        automation_behavior:
          mode: trigger
    for:
      required: true
      default: 00:00:00
      selector:
        duration:
    from: *node_status_list
    to: *node_status_list

