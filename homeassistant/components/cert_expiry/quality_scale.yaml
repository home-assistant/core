rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling:
    status: done
    comment: Certificates are checked every 12 hours via DataUpdateCoordinator.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: Integration has no external library dependencies.
  docs-actions:
    status: exempt
    comment: Integration does not register custom actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: Integration does not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: >-
      Setup after startup checks the host first. During boot the first check
      is deferred until Home Assistant has started, so monitoring its own
      certificate works (#56266).
  unique-config-entry: done
  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not register custom actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: Integration has no options flow.
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Config flow only collects host/port; the integration does not authenticate.
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Monitors user-chosen hosts; there is nothing to discover.
  discovery-update-info:
    status: exempt
    comment: Integration does not support discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Integration supports a single device per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Certificate problems are reported by problem binary sensors; there is no Home Assistant-side issue for the user to repair.
  stale-devices:
    status: exempt
    comment: Integration supports a single device per config entry.
  # Platinum
  async-dependency:
    status: exempt
    comment: Integration has no external library dependencies.
  inject-websession:
    status: exempt
    comment: Integration opens raw TLS connections and makes no HTTP requests.
  strict-typing: done
