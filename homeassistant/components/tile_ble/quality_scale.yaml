rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register actions.
  appropriate-polling:
    status: exempt
    comment: This integration listens to Bluetooth advertisements and does not poll.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: This integration has no requirements.
  docs-actions:
    status: exempt
    comment: This integration does not register actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: |
      Passive device; the user picks a Tile that Home Assistant has just received
      advertisements from, no connection is made.
  test-before-setup:
    status: exempt
    comment: A Tile that is out of range at startup is expected and is reported as away.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not have an options flow.
  docs-installation-parameters: todo
  entity-unavailable:
    status: exempt
    comment: A Tile that is out of range is reported as away instead of unavailable.
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: A Tile going out of range is expected and is reported as away.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: This integration does not require authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery:
    status: exempt
    comment: Tiles owned by other people are common, so Tiles are added through the user flow instead of discovery.
  discovery-update-info:
    status: exempt
    comment: This integration does not use discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry represents a single Tile.
  entity-category: done
  entity-device-class:
    status: exempt
    comment: Device trackers do not have a device class.
  entity-disabled-by-default:
    status: exempt
    comment: This integration only provides the device tracker.
  entity-translations:
    status: exempt
    comment: The device tracker uses the device name.
  exception-translations:
    status: exempt
    comment: This integration does not raise exceptions.
  icon-translations: todo
  reconfiguration-flow:
    status: exempt
    comment: There is nothing to reconfigure.
  repair-issues:
    status: exempt
    comment: This integration does not have any repair issues.
  stale-devices:
    status: exempt
    comment: Each config entry represents a single Tile.

  # Platinum
  async-dependency:
    status: exempt
    comment: This integration has no requirements.
  inject-websession:
    status: exempt
    comment: This integration does not make HTTP requests.
  strict-typing: todo
