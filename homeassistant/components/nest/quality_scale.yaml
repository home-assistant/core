rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: The integration does not poll.
  brands: done
  common-modules:
    status: exempt
    comment: The integration does not have a base entity or coordinator.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: todo
    comment: The integration has a removal instructions section in the documentation, but it only briefly describes how to remove the Google Cloud project and the rest of the Pub/Sub infrastructure.
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: todo
    comment: |
      The integration does a connection test in the configuration flow, however
      it does not fail if the user has ipv6 misconfigured.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: todo
    comment: |
      Supports reauthentication, however can be improved to ensure the user does not change accounts
  test-coverage: todo
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples:
    status: todo
    comment: The integration has examples in the documentation, but more could be added (e.g. automation examples for each entity type, examples using device triggers, etc.).
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices: done
  entity-category:
    status: exempt
    comment: The integration does not have any entities that are not primary entities.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The integration only exposes a few entities, and all are either relevant to the user or not noisy.
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: todo
  inject-websession: done
  strict-typing:
    status: todo
    comment: The integration itself is strictly typed, but the SDM API library does not include a py.typed file or other strict typing signifier.
