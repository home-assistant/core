capture_device_snapshot:
  target:
    entity:
      integration: recamera_pro
      domain: camera
  fields:
    output:
      required: false
      selector:
        text:

start_device_recording:
  target:
    entity:
      integration: recamera_pro
      domain: camera
  fields:
    output:
      required: false
      selector:
        text:
    duration:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

stop_device_capture:
  target:
    entity:
      integration: recamera_pro
      domain: camera

