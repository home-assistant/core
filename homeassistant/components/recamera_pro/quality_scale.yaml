rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This initial PR does not provide custom actions; planned for a follow-up PR.
  appropriate-polling:
    status: done
    comment: OTA checks run on a bounded six-hour background task and do not gate local camera updates.
  brands:
    status: done
    comment: Brand assets PR opened in home-assistant/brands.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: Config flow, zeroconf, reauth, reconfigure, and options flow tests are in tests/components/recamera_pro/test_config_flow.py.
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This initial PR does not provide custom actions; planned for a follow-up PR.
  docs-conditions:
    status: exempt
    comment: This integration does not provide custom conditions.
  docs-high-level-description:
    status: done
    comment: Integration documentation PR opened in home-assistant/home-assistant.io.
  docs-installation-instructions:
    status: done
    comment: Installation instructions included in home-assistant.io PR.
  docs-removal-instructions:
    status: done
    comment: Removal instructions included in home-assistant.io PR.
  docs-triggers:
    status: exempt
    comment: This integration uses standard event entities and does not provide custom triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions:
    status: todo
    comment: Planned for a follow-up PR with device capture actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: todo
    comment: Expanded configuration parameter reference planned for follow-up docs update.
  docs-installation-parameters:
    status: todo
    comment: Expanded installation parameter reference planned for follow-up docs update.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: todo
    comment: Planned for a follow-up PR.
  test-coverage:
    status: todo
    comment: Device API and coordinator behavior still need HA test coverage.
  # Gold
  devices: done
  diagnostics:
    status: todo
    comment: Planned for a follow-up PR after the initial single-platform integration is merged.
  discovery: done
  discovery-update-info: done
  docs-data-update:
    status: todo
    comment: Data update behavior documentation planned for Gold tier.
  docs-examples:
    status: todo
    comment: Automation examples planned for Gold tier.
  docs-known-limitations:
    status: todo
    comment: Known limitations section planned for Gold tier.
  docs-supported-devices:
    status: todo
    comment: Supported hardware matrix planned for Gold tier.
  docs-supported-functions:
    status: todo
    comment: Supported functions list planned for Gold tier.
  docs-troubleshooting:
    status: todo
    comment: Troubleshooting guide planned for Gold tier.
  docs-use-cases:
    status: todo
    comment: Use cases section planned for Gold tier.
  dynamic-devices:
    status: exempt
    comment: Each config entry represents one fixed physical camera.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: todo
    comment: Planned for a follow-up PR.
  repair-issues:
    status: exempt
    comment: No unrecoverable condition currently requires a separate repair issue.
  stale-devices:
    status: exempt
    comment: A reCamera Pro config entry represents one physical camera.
  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: Optional injected sessions are supported and ownership-tested, but HA-managed sessions still need compatibility validation for this device's cookie flow.
  strict-typing:
    status: todo
    comment: Full py.typed and strict typing validation planned for Platinum tier.
