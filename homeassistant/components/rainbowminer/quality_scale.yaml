rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration registers no custom services; pause/resume exposed via the mining switch entity actions.
  appropriate-polling: done # 30s polling interval for local API
  brands: done
  common-modules: done # coordinator, entity modules; API client provided by rainbowminer-api-client
  config-flow-test-coverage: done # full config flow test coverage
  config-flow: done # user-driven config flow
  dependency-transparency: done # depends on rainbowminer-api-client (pinned PyPI package, MIT)
  docs-actions:
    status: exempt
    comment: Integration has no custom services/actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: Polling integration with no event subscriptions.
  entity-unique-id: done # unique id based on host:port and entity key
  has-entity-name: done # has_entity_name = True on all entities
  runtime-data: done # coordinator stored in ConfigEntry.runtime_data
  test-before-configure: done # config flow validates connection to /status
  test-before-setup: done # coordinator fetches version during _async_setup
  unique-config-entry: done # _async_abort_entries_match on host and port

  # Silver
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
