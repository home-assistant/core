rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom actions are defined.
  appropriate-polling: done
  brands:
    status: done
    comment: Branding submitted in https://github.com/home-assistant/brands/pull/11345; merge pending.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom actions are defined.
  docs-conditions:
    status: exempt
    comment: No custom conditions are defined.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No custom triggers are defined.
  entity-event-setup:
    status: exempt
    comment: The coordinator manages its listeners; there are no explicit event subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery: todo
  discovery-update-info: todo
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category:
    status: exempt
    comment: Only primary light entities are exposed.
  entity-device-class:
    status: exempt
    comment: The supported generic light outputs have no applicable device class.
  entity-disabled-by-default:
    status: exempt
    comment: All entities are primary light controls.
  entity-translations:
    status: exempt
    comment: Each light uses its configured Dobiss device name.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Light entities use the default light platform icon.
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
