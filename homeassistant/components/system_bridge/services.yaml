            - backspace
            - delete
            - enter
            - tab
            - escape
            - up
            - down
            - right
            - left
            - home
            - end
            - pageup
            - pagedown
            - f1
            - f2
            - f3
            - f4
            - f5
            - f6
            - f7
            - f8
            - f9
            - f10
            - f11
            - f12
            - command
            - alt
            - control
            - shift
            - right_shift
            - space
            - printscreen
            - insert
            - audio_mute
            - audio_vol_down
            - audio_vol_up
            - audio_play
            - audio_stop
            - audio_pause
            - audio_prev
            - audio_next
            - audio_rewind
            - audio_forward
            - audio_repeat
            - audio_random
            - numpad_0
            - numpad_1
            - numpad_2
            - numpad_3
            - numpad_4
            - numpad_5
            - numpad_6
            - numpad_7
            - numpad_8
            - numpad_9
            - lights_mon_up
            - lights_mon_down
            - lights_kbd_toggle
            - lights_kbd_up
            - lights_kbd_down
          mode: dropdown
          custom_value: true
          translation_key: key
          sort: false
send_text:
  fields:
    bridge:
      required: true
      selector:
        device:
          integration: system_bridge
    text:
      required: true
      example: "Hello world"
      selector:
        text:
power_command:
  fields:
    bridge:
      required: true
      selector:
        device:
          integration: system_bridge
    command:
      required: true
      example: "sleep"
      selector:
        select:
          options:
            - "hibernate"
            - "lock"
            - "logout"
            - "restart"
            - "shutdown"
            - "sleep"
          translation_key: "power_command"
