rules:
  action-setup:
    status: exempt
    comment: This integration does not register custom actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide custom actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide custom triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  action-exceptions:
    status: done
    comment: >-
      Climate, fan, switch, schedule, and water-heater actions report translated
      failures.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not provide an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: >-
      Zeroconf discovery starts the cloud OAuth flow only; the integration
      does not use or persist a local network address.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations:
    status: done
    comment: >-
      If Daikin changes a characteristic so it belongs to a different platform,
      its existing entity can remain unavailable until the integration reloads.
      This requires a device capability change; reloading recreates the entity.
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      Platforms add newly available entities from coordinator updates without
      reloading the entry. Removed entities release their unique IDs so they can
      be added again if the device or capability returns.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      Diagnostic identifiers, network information, clock settings, and the
      account rate-limit counter are disabled by default.
  entity-translations:
    status: done
    comment: >-
      Entity descriptions use translation keys. Primary fan and water-heater
      entities intentionally use the device name directly.
  exception-translations: done
  icon-translations:
    status: done
    comment: Custom entity icons are defined in icons.json.
  reconfiguration-flow:
    status: exempt
    comment: >-
      OAuth application credentials are managed by the Application Credentials
      integration.
  repair-issues:
    status: exempt
    comment: The integration has no user-actionable repair cases.
  stale-devices:
    status: done
    comment: >-
      Users can remove gateways absent from a successful cloud response after
      an on-demand Sites lookup confirms they are no longer linked. Offline
      gateways and incomplete or failed responses do not allow removal.
  async-dependency: done
  inject-websession: done
  strict-typing: done
