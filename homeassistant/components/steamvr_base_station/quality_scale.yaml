rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register actions.
  appropriate-polling:
    status: exempt
    comment: |
      The integration is local_push; state comes from Bluetooth advertisements.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.
  docs-installation-parameters:
    status: exempt
    comment: Setup only asks which discovered base station to add.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The stations do not use authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: The Bluetooth address is the unique identifier and does not change.
  discovery: done
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry represents one station.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow:
    status: exempt
    comment: Reconfiguring would mean picking a different station, which is a new entry.
  repair-issues:
    status: exempt
    comment: The integration does not raise repair issues.
  stale-devices:
    status: exempt
    comment: Each config entry represents one station; removing the entry removes it.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The library communicates over Bluetooth and does not use HTTP.
  strict-typing: todo
