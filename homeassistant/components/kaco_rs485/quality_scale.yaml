rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: >-
      local_polling; entities rely solely on CoordinatorEntity's built-in
      lifecycle, with no manual event subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any service actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >-
      A local serial bus. A proxied port is reached through the ESPHome
      integration's own authenticated connection, so this integration holds no
      credential that can expire or be invalidated.
  test-coverage: done
  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: There is no discovery to carry updated network information.
  discovery:
    status: exempt
    comment: >-
      Nothing on an RS485 bus announces itself; addresses are set on each
      inverter's front panel. The bus is scanned during setup instead.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: todo
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: >-
      All four sensors in this initial platform are primary readings that a user
      adds the integration to get. The follow-up PR adding the full command `0`
      and `3` field set is where less popular entities start being disabled.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Entities use device_class-derived icons; no custom icons are needed.
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: This integration talks to a serial port, not HTTP.
  strict-typing: done
