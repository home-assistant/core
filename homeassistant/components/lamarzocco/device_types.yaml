# Maps the traits of a device type onto La Marzocco's entities.
#
# Keyed by device type, then by trait. The value addresses an entity as
# `<domain>.<translation_key>`; it looks like an entity ID but is not one, since
# translation_key is what identifies an entity description across installations.
# Scoping by device type means the same translation_key can fill a different
# trait on a different appliance.
#
# A trait may list several candidates when models expose it differently. The
# first one that exists on the device fills the trait.
#
# Only traits the core vocabulary defines appear here. Vendor specific entities
# (smart standby, auto on/off, prebrew mode, firmware updates) fill no trait and
# are deliberately left out.

appliance.espresso_machine:
  traits:
    brewing: binary_sensor.brew_active
    cleaning_active: binary_sensor.backflush_enabled
    coffee_boiler_ready_time: sensor.coffee_boiler_ready_time
    coffee_boiler_target_temperature: number.coffee_temp
    power: switch.main
    start_cleaning: button.start_backflush
    steam_boiler_power: switch.steam_boiler
    steam_boiler_ready_time: sensor.steam_boiler_ready_time
    # Linea Mini and Micra pick a steam temperature from three steps rather than
    # setting a free value, so on those models a select fills the trait.
    steam_boiler_target_temperature:
      - number.steam_temp
      - select.steam_temp_select
    water_tank_empty: binary_sensor.water_tank
