# Describes the format for available hue services

# legacy hue_activate_scene to activate a scene
hue_activate_scene:
  fields:
    group_name:
      example: "Living Room"
      selector:
        text:
    scene_name:
      example: "Energize"
      selector:
        text:
    dynamic:
      selector:
        boolean:

# entity service to activate a Hue scene (V2)
activate_scene:
  target:
    entity:
      domain: scene
      integration: hue
  fields:
    transition:
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    dynamic:
      selector:
        boolean:
    scene_customization:
      collapsed: true
      fields:
        speed:
          selector:
            number:
              min: 0
              max: 100
        brightness:
          selector:
            number:
              min: 1
              max: 255

# entity services to flash Hue lights, rooms and zones (V2)
flash:
  target:
    entity:
      domain: light
      integration: hue
  fields:
    duration:
      required: true
      example: 5
      selector:
        duration:
    rgb_color:
      example: "[255, 100, 100]"
      selector:
        color_rgb:
    second_rgb_color:
      example: "[100, 100, 255]"
      selector:
        color_rgb:

stop_flash:
  target:
    entity:
      domain: light
      integration: hue
