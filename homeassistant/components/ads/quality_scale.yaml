rules:
  # Bronze
  action-setup:
    status: todo
    comment: The action is registered before the connection is made; when setup fails, calling it raises a KeyError instead of a ServiceValidationError.
  appropriate-polling:
    status: exempt
    comment: The integration is push based and does not poll.
  brands: done
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: todo
  dependency-transparency:
    status: todo
    comment: pyads 3.4.0 was not published from a public CI pipeline; 3.6.0 is, but its sdist does not build on Alpine yet.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions:
    status: todo
    comment: The documentation does not yet describe the route to Home Assistant that the TwinCAT device needs.
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id:
    status: todo
    comment: The unique ID is the ADS variable name, which changes when the entity is pointed at another variable.
  has-entity-name: todo
  runtime-data: todo
  test-before-configure: todo
  test-before-setup: todo
  unique-config-entry: todo

  # Silver
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: ADS does not authenticate; access is granted by a route on the device.
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession:
    status: exempt
    comment: The integration does not make HTTP requests.
  strict-typing: todo
