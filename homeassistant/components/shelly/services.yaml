get_kvs_value:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: shelly
    key:
      required: true
      selector:
        text:

set_kvs_value:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: shelly
    key:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        object:

set_cover_position_and_tilt:
  target:
    entity:
      integration: shelly
      domain: cover
      supported_features:
        - - cover.CoverEntityFeature.SET_POSITION
          - cover.CoverEntityFeature.SET_TILT_POSITION
  fields:
    position:
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    tilt_position:
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
