rules:
  # Bronze tier rules
  action-setup:
    status: exempt
    comment: Integration does not provide service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not provide service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: This integration does not subscribe to external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  docs-conditions:
    status: exempt
    comment: Integration does not implement conditions
  docs-triggers:
    status: exempt
    comment: Integration does not implement triggers

  # Silver tier rules
  action-exceptions:
    status: exempt
    comment: Integration does not provide service actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: Integration is configured entirely via the config flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: done

  # Gold tier rules
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: Integration connects to a user-provided FMD server URL; no discovery.
  discovery:
    status: exempt
    comment: Integration connects to a user-provided FMD server URL; no discovery.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: done
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry represents a single FMD device account.
  entity-category: done
  entity-device-class:
    status: exempt
    comment: Entities are tracker/configuration entities without device classes.
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Entities use default icons for their domains.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: Integration does not have any known issues that require repair.
  stale-devices:
    status: exempt
    comment: Each config entry represents a single device; no device pruning needed.

  # Platinum tier rules
  async-dependency: done
  inject-websession: todo
  strict-typing: todo
