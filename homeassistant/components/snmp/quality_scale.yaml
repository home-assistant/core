rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide additional actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide additional actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions:
    status: todo
    comment: The installation instructions for the user interface are in review in https://github.com/home-assistant/home-assistant.io/pull/44383.
  docs-removal-instructions:
    status: todo
    comment: The removal instructions for the user interface are in review in https://github.com/home-assistant/home-assistant.io/pull/44383.
  docs-triggers:
    status: exempt
    comment: This integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: Entities of this integration do not subscribe to events.
  entity-unique-id:
    status: todo
    comment: The config entry device tracker entities have unique IDs, but the legacy YAML device tracker, sensor and switch platforms do not. This will be addressed in a future PR.
  has-entity-name:
    status: exempt
    comment: The device tracker entities do not belong to a device, so they can not use the name of their device.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable:
    status: todo
    comment: The device tracker entities follow their coordinator, but the YAML sensor and switch platforms keep their last value when the device stops responding. This will be addressed when those platforms are migrated.
  integration-owner: todo
  log-when-unavailable:
    status: todo
    comment: The device tracker coordinator logs through UpdateFailed, but the YAML sensor and switch platforms do not log when the device stops responding. This will be addressed when those platforms are migrated.
  parallel-updates:
    status: todo
    comment: PARALLEL_UPDATES will be set once the sensor and switch platforms are migrated.
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: "The migrated modules are above 95%, but sensor.py is at 81% and switch.py at 85%. This will be addressed when those platforms are migrated."

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
