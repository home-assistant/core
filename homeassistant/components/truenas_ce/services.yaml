---
# Home Assistant reads action/service names+descriptions from strings.json
# (services.<id>); this file defines only the schema (fields/target/selectors).
# Keep it in sync with the services registered via SENSOR_SERVICES in
# sensor_types.py / binary_sensor_types.py.

cloudsync_run:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
cloudsync_abort:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
rsync_run:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
replication_run:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
snapshottask_run:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
dataset_snapshot:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
system_reboot:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
system_shutdown:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
system_refresh:
  target:
    entity:
      integration: truenas_ce
      domain: sensor
service_start:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
service_stop:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
service_restart:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
service_reload:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
vm_start:
  fields:
    overcommit:
      required: false
      default: false
      selector:
        boolean: null
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
vm_stop:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
vm_restart:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
container_start:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
container_stop:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
container_restart:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
app_start:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
app_stop:
  target:
    entity:
      integration: truenas_ce
      domain: binary_sensor
dataset_lock:
  fields:
    force_umount:
      required: false
      default: false
      selector:
        boolean: null
  target:
    entity:
      integration: truenas_ce
      domain: sensor
dataset_unlock:
  fields:
    passphrase:
      required: false
      selector:
        text:
          type: password
    recursive:
      required: false
      default: false
      selector:
        boolean: null
    force:
      required: false
      default: false
      selector:
        boolean: null
  target:
    entity:
      integration: truenas_ce
      domain: sensor
passphrase_set:
  fields:
    passphrase:
      required: true
      selector:
        text:
          type: password
  target:
    entity:
      integration: truenas_ce
      domain: sensor
passphrase_remove:
  fields:
    dataset_path:
      required: true
      selector:
        text: {}
    config_entry:
      required: false
      selector:
        config_entry:
          integration: truenas_ce
passphrase_list:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: truenas_ce
alert_dismiss:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: truenas_ce
    uuid:
      required: true
      selector:
        text: null
alert_restore:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: truenas_ce
    uuid:
      required: true
      selector:
        text: null
alert_list:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: truenas_ce
    properties:
      required: false
      default: uuid,formatted
      selector:
        text: null
