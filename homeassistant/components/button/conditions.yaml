is_being_held:
  target:
    entity:
      - domain: event
        device_class: button
        capability:
          event_types:
            - - long_press_start
              - long_press_end
  fields:
    behavior:
      required: true
      default: any
      selector:
        automation_behavior:
          mode: condition
    for:
      required: true
      default: 00:00:00
      selector:
        duration:
