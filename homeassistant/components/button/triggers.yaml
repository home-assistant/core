.event_button_target: &event_button_target
  entity:
    domain: event
    device_class: button

pressed:
  target:
    entity:
      - domain: button
      - domain: input_button
      - domain: event
        device_class: button
double_pressed:
  target: *event_button_target
hold_started:
  target: *event_button_target
hold_ended:
  target: *event_button_target
being_held:
  target: *event_button_target
  fields:
    repeat_interval:
      required: true
      default: 00:00:01
      selector:
        duration:
