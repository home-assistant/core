rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: todo
    comment: |
      The actions and the switch and valve commands do not handle API errors.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not have an options flow.
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery:
    status: todo
    comment: |
      Controllers live on the local network, investigate if they can be
      discovered using DHCP.
  discovery-update-info:
    status: exempt
    comment: This integration connects to a cloud service, not to the device.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: done
  entity-category:
    status: todo
    comment: The connectivity binary sensor should be a diagnostic entity.
  entity-device-class:
    status: todo
    comment: The remaining watering time sensor is missing the duration device class.
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations:
    status: todo
    comment: Errors raised by actions and entity commands are not translated.
  icon-translations:
    status: todo
    comment: The sensor entity overrides the icon property based on its state.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: This integration does not raise any repairable issues.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: The pydrawise library does not accept a websession yet.
  strict-typing: done
