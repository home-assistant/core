# Commented out rules still need to be checked
rules:
  # Bronze
  action-setup: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/services.py#L224
  appropriate-polling: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/coordinator.py#L14
  brands: done  # https://github.com/home-assistant/brands/tree/master/core_integrations/simplisafe
  common-modules: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/coordinator.py and https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/entity.py
  # config-flow-test-coverage: todo  # Need to check this
  config-flow: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/config_flow.py
  dependency-transparency: done  # https://github.com/bachya/simplisafe-python
  docs-actions: done  #https://www.home-assistant.io/integrations/simplisafe/#list-of-actions
  docs-conditions:
    status: exempt
    comment: The integration does not register any conditions.
  docs-high-level-description: done  # https://www.home-assistant.io/integrations/simplisafe/
  docs-installation-instructions: done  # https://www.home-assistant.io/integrations/simplisafe/#configuration
  docs-removal-instructions: todo
  docs-triggers: todo
  entity-event-setup: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/entity.py#L221
  entity-unique-id: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/entity.py#L116
  has-entity-name: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/entity.py#L54
  runtime-data: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/__init__.py#L222
  test-before-configure: done # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/config_flow.py#L106
