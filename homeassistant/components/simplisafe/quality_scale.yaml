  unique-config-entry: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/__init__.py#L186

  # Silver
  action-exceptions: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/lock.py#L74
  config-entry-unloading: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/__init__.py#L250
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/entity.py#L132
  integration-owner: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/manifest.json#L5
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/config_flow.py#L70
  # test-coverage: todo  # Need to check this

  # Gold
  devices: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/entity.py#L102
  diagnostics: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/diagnostics.py
  discovery-update-info:
    status: todo
    comment: Same reason as discovery.
  discovery:
    status: todo
    comment: The docs state that it can be auto-discovered, but the manifest.json and the config flow do not have the "zeroconf" items needed.
  docs-data-update: done  # https://www.home-assistant.io/integrations/simplisafe/
  docs-examples: done  # https://www.home-assistant.io/integrations/simplisafe/#automation-example-detecting-secret-alert-events
  docs-known-limitations: todo
  docs-supported-devices: done  # https://www.home-assistant.io/integrations/simplisafe/
  docs-supported-functions: done # https://www.home-assistant.io/integrations/simplisafe/
  docs-troubleshooting: todo
  docs-use-cases: done  # https://www.home-assistant.io/integrations/simplisafe/
  dynamic-devices:
    status: exempt
    comment: The integration only registers one fixed device per config entry.  # Need to check this
  entity-category: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/button.py#L65
  entity-device-class: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/sensor.py#L51
  entity-disabled-by-default:
    status: todo
    comment: No entities are disabled by default.  Several could be, but that is a conversation probably best had during review.
  entity-translations:
    status: todo
    comment: Some entities are translated, but not all.
  exception-translations:
    status: todo
    comment: Some exceptions are translated, but not all.
  icon-translations: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/icons.json
  reconfiguration-flow: todo
  # repair-issues:
  #   status: todo
  #   comment: No repair issues currently raised, however it is possible that none need to be.
  stale-devices: done  # https://contributors.home-assistant.io/core/quality-scale/stale-devices/

  # Platinum
  async-dependency: done  # https://github.com/bachya/simplisafe-python/blob/dev/simplipy/api.py
  inject-websession: done  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/simplisafe/__init__.py#L204
  strict-typing: done  # https://github.com/bachya/simplisafe-python/blob/dev/simplipy/py.typed
