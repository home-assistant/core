set_demand_control:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: daikin
    en_demand:
      required: true
      selector:
        boolean:
    max_pow:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    mode:
      default: "manual"
      selector:
        select:
          translation_key: "demand_control_mode"
          options:
            - "manual"
            - "scheduled"
            - "auto"
