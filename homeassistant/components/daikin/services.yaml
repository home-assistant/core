set_demand_control:
  target:
    entity:
      integration: daikin
      domain: climate
  fields:
    en_demand:
      required: true
      selector:
        boolean:
    max_pow:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    mode:
      default: "0"
      selector:
        select:
          options:
            - value: "0"
              label: Manual
            - value: "1"
              label: Scheduled
            - value: "2"
              label: Auto
