rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not register custom actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No configuration parameters.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: This integration relies on MAC-based BLE connections.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: todo
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: This integration connects to a single device.
  entity-category:
    status: exempt
    comment: The lock is the primary entity; no secondary entities exist.
  entity-device-class:
    status: exempt
    comment: Lock entities do not have device classes.
  entity-disabled-by-default:
    status: exempt
    comment: The lock is the only entity and should be enabled by default.
  entity-translations:
    status: exempt
    comment: The only entity uses the device name directly via _attr_name = None.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: No custom icons.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: No repair issues currently implemented.
  stale-devices:
    status: exempt
    comment: This integration connects to a single device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Local BLE integration does not use aiohttp websession.
  strict-typing: todo
