rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      This integration does not provide additional actions.
  appropriate-polling:
    status: exempt
    comment: |
      This integration uses local push (mDNS/zeroconf discovery + UDP data
      stream) and does not poll devices.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: |
      This integration does not provide additional actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: |
      Devices are discovered at runtime via mDNS, so there is nothing to
      connect to during the config flow.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable:
    status: done
    comment: |
      Device entities become unavailable when no update arrives within the
      timeout.  The Virtual Household entities are deliberately always
      available: they are an in-process calculation, and the device entities
      they derive from already show when their data stops.
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: |
      This integration does not use authentication.
  test-coverage: todo
  # Gold
  devices: todo
  diagnostics: todo
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: |
      Devices and their role-gated entities are deliberately never removed.
      Sensors drop off the network and re-appear, and a sensor that has
      forgotten its role reports the real one again once it recovers, so a
      removal would usually be undone moments later and would discard the
      energy history recorded against those entities.  Hardware that has
      genuinely been removed or re-purposed is deleted by the user.

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
