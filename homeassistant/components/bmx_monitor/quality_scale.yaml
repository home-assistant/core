rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide service actions.

  appropriate-polling:
    status: done
    comment: |
      Reads are driven by BLE advertisements via ActiveBluetoothProcessorCoordinator,
      with its 10 second debounce. A fixed fallback read runs only when the device has
      been seen and no read has happened for 60 seconds. The rate limit option never
      schedules reads; it only skips reads that would start sooner than the configured
      10-120 seconds after the previous one.
