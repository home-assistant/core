rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: >-
      local_polling; entities rely solely on CoordinatorEntity's built-in
      lifecycle, with no manual event subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >-
      Local Modbus RTU/TCP; there is no authentication that can expire or be
      invalidated.
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: There is no discovery to carry updated network information.
  discovery:
    status: exempt
    comment: >-
      A Modbus RTU-over-TCP gateway advertises no mDNS service and sends no
      DHCP hostname identifying the device behind it.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One fixed sensor array per config entry; nothing is discovered at runtime.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: >-
      Every entity but UV index derives its icon from a device class. UV index
      has no matching device class, and the sensor default suits it.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >-
      The failures this integration can hit are a device that stops answering
      and a device that answers as something else. The first is transient and
      already shown by entity unavailability; the second is raised as a
      config-entry error pointing at the reconfigure flow. Neither is a
      condition a repair issue could add fixable detail to.
  stale-devices:
    status: exempt
    comment: One fixed sensor array per config entry; nothing to detect as stale.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: This integration communicates over Modbus, not HTTP.
  strict-typing: done
