.circulation_slots: &circulation_slots
  selector:
    object:
      multiple: true
      label_field: from
      description_field: to
      fields:
        from:
          required: true
          selector:
            time:
        to:
          required: true
          selector:
            time:
        mode:
          required: true
          selector:
            select:
              options:
                - "on"
                - "cycles_5_25"
                - "cycles_5_10"
              translation_key: circulation_mode

get_circulation_schedule:
  target:
    entity:
      integration: vicare
      domain: water_heater
set_circulation_schedule:
  target:
    entity:
      integration: vicare
      domain: water_heater
  fields:
    monday: *circulation_slots
    tuesday: *circulation_slots
    wednesday: *circulation_slots
    thursday: *circulation_slots
    friday: *circulation_slots
    saturday: *circulation_slots
    sunday: *circulation_slots
set_vicare_mode:
  target:
    entity:
      integration: vicare
      domain: climate
  fields:
    vicare_mode:
      required: true
      selector:
        select:
          options:
            - "dhw"
            - "dhwAndHeating"
            - "dhwAndHeatingCooling"
            - "forcedNormal"
            - "forcedReduced"
            - "heating"
            - "standby"
