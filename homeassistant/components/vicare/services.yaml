set_circulation_schedule:
  target:
    entity:
      integration: vicare
      domain: water_heater
  fields:
    monday:
      selector:
        object:
          multiple: true
          label_field: start
          description_field: end
          fields:
            start:
              required: true
              selector:
                text:
            end:
              required: true
              selector:
                text:
            mode:
              required: true
              selector:
                select:
                  options:
                    - "on"
                    - "off"
                  custom_value: true
                  mode: dropdown
            position:
              required: true
              selector:
                number:
                  min: 0
                  mode: box
