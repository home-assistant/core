rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide additional actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide additional actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: Entities of this integration do not explicitly subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not provide additional actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not have an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: This integration is a cloud service and does not support discovery.
  discovery-update-info:
    status: exempt
    comment: This integration is a cloud service and does not support discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: This integration is a cloud service and does not support devices.
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: This integration has a fixed single service device per config entry.
  entity-category: done
  entity-device-class: todo
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: |
      The API key can be changed in the reauthentication flow. Changing the
      location changes the unique ID (location key), so it requires a new
      config entry.
  repair-issues:
    status: exempt
    comment: This integration doesn't have any cases where raising an issue is needed.
  stale-devices:
    status: exempt
    comment: This integration has a fixed single service device per config entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
