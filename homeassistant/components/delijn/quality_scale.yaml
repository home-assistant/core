rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide any actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: The entity polls through a DataUpdateCoordinator; it does not subscribe to push events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: This integration is cloud polling only; it has no local discovery.
  discovery:
    status: exempt
    comment: This integration is cloud polling only; it has no local discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: This integration does not support physical devices, only De Lijn stops.
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry represents exactly one stop and creates exactly one device.
  entity-category:
    status: exempt
    comment: The sensor is the primary function of the integration, not a diagnostic or config entity.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The single sensor is the primary function of the integration.
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: done
    comment: A repair issue is raised for the deprecated YAML sensor platform.
  stale-devices:
    status: exempt
    comment: Each config entry represents exactly one stop and one device; removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: pydelijn does not yet ship a py.typed marker (PEP 561).
