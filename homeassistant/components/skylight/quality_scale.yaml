  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Not planned for the initial release.
  repair-issues:
    status: exempt
    comment: No repair issues are raised.
  stale-devices:
    status: exempt
    comment: Each config entry has exactly one device that is removed with the entry.
  strict-typing: done

  # Platinum
  async-dependency: done
  inject-websession: done
