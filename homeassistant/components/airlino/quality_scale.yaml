rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom service actions to register
  appropriate-polling: done
  brands: todo
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup:
    status: exempt
    comment: No event listeners/subscriptions are used.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No special configuration option. Also mentioned in the documentation
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: todo
  reauthentication-flow:
    status: todo
    comment: In case the device changes its IP address it will be automatically detected and updated using zero-conf. Not possible yet to update manually.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Integration type device not hub or service where we dont have standalone devices.
  entity-category:
    status: exempt
    comment: For the entity (once per device) the default category is appropriate.
  entity-device-class: todo
  entity-disabled-by-default:
    status: exempt
    comment: No noisy attributes on entities.
  entity-translations:
    status: exempt
    comment: _attr_name is set to None.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: No custom icons used.
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: Only a single device per config entry.

  # Platinum
  async-dependency:
    status: exempt
    comment: no external dependencies.
  inject-websession: todo
  strict-typing: todo
