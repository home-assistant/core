# Describes the format for available vacuum services

stop:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.STOP

locate:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.LOCATE

start:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.START

pause:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.PAUSE

return_to_base:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.RETURN_HOME

clean_spot:
  target:
    entity:
      domain: vacuum

clean_area:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.CLEAN_AREA
  fields:
    cleaning_area_id:
      required: true
      selector:
        area:
          multiple: true
          reorder: true
    passes:
      required: false
      example: 2
      selector:
        number:
          min: 1
          step: 1
          mode: box

send_command:
  target:
    entity:
      domain: vacuum
  fields:
    command:
      required: true
      example: "set_dnd_timer"
      selector:
        text:
    params:
      example: '{ "key": "value" }'
      selector:
        object:

set_fan_speed:
  target:
    entity:
      domain: vacuum
  fields:
    fan_speed:
      required: true
      example: "low"
      selector:
        state:
          attribute: fan_speed
