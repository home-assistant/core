rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: The integration does not poll
  brands: done
  common-modules:
    status: exempt
    comment: The integration has only a single platform
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: The integration does not register events
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: The integration has only stateless entities
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: The integration has only stateless entities
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics:
    status: exempt
    comment: |
      The integration does not fetch data and the entry contains mostly sensitive information
  discovery-update-info:
    status: exempt
    comment: The integration cannot be discovered
  discovery:
    status: exempt
    comment: The integration has no discoverable devices
  docs-data-update:
    status: exempt
    comment: |
      This integration does not update any data
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration is a service and has no physical devices
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: The integration is a service and has no physical devices
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The integration has no entities that should be disabled
  entity-translations:
    status: exempt
    comment: The integration has no entities that need to be translated
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: The integration has no stale devices

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration does not do HTTP requests
  strict-typing: done
