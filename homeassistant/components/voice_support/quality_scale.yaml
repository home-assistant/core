rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom actions.
  appropriate-polling:
    status: exempt
    comment: >-
      Nothing is polled for state. What the app can verify is re-read every
      ten minutes because an app update can change it, and verdicts are
      pushed over a websocket opened per detection.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No third-party dependency; the app is reached over plain HTTP.
  docs-actions:
    status: exempt
    comment: No custom actions.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup:
    status: exempt
    comment: No entities.
  entity-unique-id:
    status: exempt
    comment: No entities.
  has-entity-name:
    status: exempt
    comment: No entities.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No custom actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: Nothing is configurable.
  docs-installation-parameters:
    status: exempt
    comment: Nothing is configurable.
  entity-unavailable:
    status: exempt
    comment: No entities.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: exempt
    comment: No entities.
  reauthentication-flow:
    status: exempt
    comment: Local app on the Supervisor network; nothing to authenticate.
  test-coverage: done

  # Gold
  devices:
    status: exempt
    comment: The app is a service, not a device.
  diagnostics: todo
  discovery: done
  discovery-update-info: done
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: No devices.
  entity-category:
    status: exempt
    comment: No entities.
  entity-device-class:
    status: exempt
    comment: No entities.
  entity-disabled-by-default:
    status: exempt
    comment: No entities.
  entity-translations:
    status: exempt
    comment: No entities.
  exception-translations:
    status: exempt
    comment: Nothing raised here reaches the user.
  icon-translations:
    status: exempt
    comment: No entities.
  reconfiguration-flow:
    status: todo
    comment: >-
      An app found through the Supervisor announces its address again when it
      moves, but one whose address was typed in has to be removed and added
      again.
  repair-issues:
    status: exempt
    comment: >-
      An app that cannot be reached is logged and ignored; wake words are
      accepted unverified rather than the assistant going deaf, so there is
      nothing for the person to repair.
  stale-devices:
    status: exempt
    comment: No devices.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
