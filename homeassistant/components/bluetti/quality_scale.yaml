rules:
  # Bronze
  action-setup:
    status: exempt
    comment: >-
      No custom service actions are registered; only standard entity
      services (turn_on/turn_off/select_option) are used, which Home
      Assistant handles natively.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  # ^ pybluetti and bluetti-modbus (bluetti-community/bluetti-modbus) are
  #   both properly published, versioned PyPI packages - no vendored code.
  docs-actions:
    status: exempt
    comment: No custom service actions are provided by this integration.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: >-
      Devices are added via the BLUETTI cloud account; the optional local
      Modbus connection (host/port) must still be entered manually - there is
      no discovery protocol for BLUETTI's Modbus TCP interface either.
  discovery:
    status: exempt
    comment: >-
      Devices are added via the BLUETTI cloud account (OAuth2); the optional
      local Modbus connection (host/port) must still be entered manually,
      since there is no discovery protocol (mDNS/SSDP/etc.) for BLUETTI's
      Modbus TCP interface.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: >-
      A newly bound BLUETTI account device does not show up automatically -
      the user must open the options flow and select it. The rule requires
      fully automatic detection and entity creation with no user
      interaction; a previous "done" claim here didn't hold up against the
      rule's own documentation.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  # ^ Modbus-sourced diagnostic-category sensors set
  #   _attr_entity_registry_enabled_default = False (see sensor.py's
  #   BluettiModbusSensor.__init__) - the rule has no exceptions, so a
  #   previous "exempt" claim here (on the theory that no entity qualified)
  #   didn't hold up once actually checked against the rule's own text.
  entity-translations:
    status: todo
    comment: >-
      Cloud-sourced entities remain untranslated: their names are provided
      dynamically by the BLUETTI cloud API per device/firmware (fnName), not
      static strings known at development time (see entity.py). The rule
      has no exceptions for this - a previous "done" claim treated the
      Modbus-sourced entities' real translations (which do satisfy the rule
      for their own portion) as sufficient for the whole integration, which
      the rule's own text doesn't support.
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: >-
      mypy --strict already passes locally and in CI (scripts/typecheck).
      What's left is out of this repo's hands: the rule also requires the
      integration's own entry in home-assistant/core's .strict-typing file,
      only possible once actually submitted to core.
