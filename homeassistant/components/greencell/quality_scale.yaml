rules:
  # Bronze

  action-setup:
    status: exempt
    comment: Integration does not register custom actions or services.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not register custom actions or services.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not have an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: |
      The device is addressed by its serial number only. Authentication is
      handled by the MQTT integration, not by this integration.
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: |
      Devices are discovered over MQTT and are addressed by serial number. The
      integration stores no network information that could become outdated.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      This integration is not a hub. Each config entry represents a single
      device, which is created during setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: |
      The serial number is the only configuration value and it identifies the
      device. Pointing an entry at a different device means adding a new entry.
  repair-issues:
    status: exempt
    comment: |
      This integration does not have any repairable issues.
  stale-devices:
    status: exempt
    comment: |
      Each config entry represents a single device, which is removed together
      with the config entry.

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
