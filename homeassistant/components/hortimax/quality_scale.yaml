rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide additional actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide additional actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide additional conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide additional triggers.
  entity-event-setup:
    status: exempt
    comment: |
      The entities of this integration do not subscribe to events; they read
      from the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not provide additional actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not provide an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery:
    status: exempt
    comment: |
      The cloud API has no presence on the local network. The on-premise
      deployment runs on a Ridder Connect Box, which is configured with a
      static IP and advertises no mDNS service, so it turns up in neither
      mDNS nor DHCP discovery.
  discovery-update-info:
    status: exempt
    comment: |
      Nothing is discovered, so there is no discovery information to keep up
      to date.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: |
      Entity names are derived at runtime from the readout identifier. The
      identifiers are Ridder's rather than the grower's, since custom sensors
      are not exposed through the API, so a translation key per readout subject
      is possible. The derived name stays as the fallback for readouts a later
      firmware adds.
  exception-translations: done
  icon-translations:
    status: todo
    comment: |
      Icons are chosen per readout subject at runtime, on the same fixed set of
      subjects as entity-translations, so they can move to icons.json with it.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: No known use cases for repair issues or flows yet.
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
