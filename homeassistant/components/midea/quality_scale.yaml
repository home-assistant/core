rules:
  # Bronze
  action-setup:
    status: exempt
    comment: no action
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: no actions
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >
      Cloud login is only used transiently during the config flow to mint a
      local device token/key, which is then stored and used for local polling
      only; the cloud is never contacted again. midealocal.device.connect()
      also swallows AuthException into a plain bool, so a rejected token/key
      is indistinguishable from the device being offline and there is no
      signal that could trigger a reauth flow.
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery:
    status: exempt
    comment: >
      DHCP is used to synchronize the IP address of already configured devices
      when their DHCP lease changes. It is not used for device discovery because
      DHCP information alone is insufficient to identify and configure most supported
      Midea appliances.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry per physical device, no hub.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No known use cases for repair issues, yet.
  stale-devices:
    status: exempt
    comment: One config entry per physical device, no hub.

  # Platinum
  async-dependency: todo
  inject-websession: done
  strict-typing: done
