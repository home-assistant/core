.device: &device
  required: true
  selector:
    device:
      filter:
        - integration: engie_be
      multiple: true

.price: &price
  required: false
  selector:
    number:
      min: -1
      max: 5
      step: 0.001
      mode: box
      unit_of_measurement: EUR/kWh

epex_hour_price_is_negative:
  fields:
    device_id: *device

epex_quarter_hour_price_is_negative:
  fields:
    device_id: *device

epex_hour_price_is_in_range:
  fields:
    device_id: *device
    above: *price
    below: *price

epex_quarter_hour_price_is_in_range:
  fields:
    device_id: *device
    above: *price
    below: *price
