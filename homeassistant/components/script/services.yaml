# Describes the format for available python_script services

reload:
turn_on:
  target:
    entity:
      domain: script

turn_off:
  target:
    entity:
      domain: script

toggle:
  target:
    entity:
      domain: script

reset_stored_variables:
  target:
    entity:
      domain: script
  fields:
    variables:
      example: '["count"]'
      selector:
        text:
          multiple: true
