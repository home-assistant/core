rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: No polling.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: The conversation entity does not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: The conversation entity has no state to fetch.
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: The conversation entity has no state to fetch.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: No discovery.
  discovery:
    status: exempt
    comment: This is a cloud service integration that cannot be discovered locally.
  docs-data-update:
    status: exempt
    comment: The conversation entity has no data to update.
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: The integration has a single service device.
  entity-category:
    status: exempt
    comment: The conversation entity is a primary entity.
  entity-device-class:
    status: exempt
    comment: Conversation entities have no device class.
  entity-disabled-by-default:
    status: exempt
    comment: The conversation entity is the main entity.
  entity-translations:
    status: exempt
    comment: The conversation entity uses the device name.
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No repairs.
  stale-devices:
    status: exempt
    comment: The service device is removed with the config entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The underlying library uses gRPC, not aiohttp/httpx, for communication.
  strict-typing: done
