add_charge_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: tesla_fleet
    days_of_week:
      required: true
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          multiple: true
          translation_key: days_of_week
    enable:
      required: true
      selector:
        boolean:
    start_time:
      required: false
      selector:
        time:
    end_time:
      required: false
      selector:
        time:
    location:
      required: false
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
    one_time:
      required: false
      selector:
        boolean:
    id:
      required: false
      selector:
        number:
          min: 1
          mode: box

remove_charge_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: tesla_fleet
    id:
      required: true
      selector:
        number:
          min: 1
          mode: box
