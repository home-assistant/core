navigate_to_destination:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    destination:
      required: true
      example: "1600 Amphitheatre Parkway, Mountain View, CA"
      selector:
        text:

navigate_to_coordinates:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    gps:
      required: true
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
navigate_to_waypoints:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tesla_fleet
    place_ids:
      required: true
      example: '["ChIJVTPokywQkFQRmtVEaUZlJRA", "ChIJQWCmo89rkFQRZQfQ6oJUz7o"]'
      selector:
        text:
          multiple: true
