rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide any actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: This integration does not use an external library.
  docs-actions:
    status: exempt
    comment: This integration does not provide any actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events; data is provided by a coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not provide any actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration has no configuration options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The public pretalx schedule does not require authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: pretalx is a cloud service without discovery.
  discovery:
    status: exempt
    comment: pretalx is a cloud service without discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: A config entry represents a single event; its rooms map to entities.
  entity-category:
    status: exempt
    comment: The calendar entities are the primary entities of the integration.
  entity-device-class:
    status: exempt
    comment: Calendar entities do not have device classes.
  entity-disabled-by-default:
    status: exempt
    comment: Calendar entities are the primary entities and enabled by default.
  entity-translations:
    status: exempt
    comment: Entity names are the room names provided by pretalx.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Calendar entities use the default calendar icon.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: This integration has no repairable issues.
  stale-devices:
    status: exempt
    comment: Rooms are represented as entities within a single event device.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
