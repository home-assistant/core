rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration has no options flow; user management is chosen during setup.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Uses a locally-generated cryptographic identity that does not expire.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery: done
  discovery-update-info:
    status: exempt
    comment: BLE address is both the unique ID and connection parameter.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: This integration connects to a single device.
  entity-category: done
  entity-device-class:
    status: exempt
    comment: Lock entities have no device classes, and no binary sensor device class describes a lock credential.
  entity-disabled-by-default:
    status: exempt
    comment: The lock and the credential sensors are all cheap to keep enabled — they read from a credential list fetched once at setup.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Entities use the default platform icons; only the action has an icon.
  reconfiguration-flow:
    status: exempt
    comment: Configuration is a BLE address and generated identities. The identities can only be enrolled during a Master Card scan, so changing them means setting the lock up again.
  repair-issues:
    status: exempt
    comment: This integration does not raise any repairable issues.
  stale-devices:
    status: exempt
    comment: This integration connects to a single device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: This integration does not use HTTP sessions.
  strict-typing: done
