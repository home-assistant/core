  discovery-update-info:
    status: exempt
    comment: |
      No IP discovery.
  discovery:
    status: exempt
    comment: |
      The Dimes Wave tank sensors only pair over Bluetooth with the ROTAREX
      DIMES mobile app, which uploads their measurements to the Rotarex cloud.
      They never join the home network, so they can't be discovered via
      DHCP, mDNS, or SSDP, and the integration never connects to them directly.
