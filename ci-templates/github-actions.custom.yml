name: CI Custom (Self-Hosted + Docker Integration)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt

      - name: Run lint
        run: ruff check homeassistant tests

  integration-tests:
    runs-on: self-hosted
    needs: lint
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build containers
        run: docker compose -f tests/compose.yml build

      - name: Run integration tests
        run: docker compose -f tests/compose.yml run --rm test pytest -q tests/components

      - name: Tear down
        if: always()
        run: docker compose -f tests/compose.yml down -v
