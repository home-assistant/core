rules:
  anonymous-definition:
    ignore:
      - check-requirements.lock.yml
  github-env:
    ignore:
      # gh-aw only exports trusted runner.tool_cache metadata for later steps.
      - check-requirements.lock.yml:435:9
  ref-version-mismatch:
    ignore:
      - check-requirements.lock.yml
  template-injection:
    ignore:
      - check-requirements.lock.yml
  undocumented-permissions:
    ignore:
      - check-requirements.lock.yml
  unsound-condition:
    ignore:
      # gh-aw emits an unsound folded fork guard; remove after it is fixed upstream.
      # Re-review this finding and update the locator if the lock file is regenerated.
      - check-requirements.lock.yml:81:5
