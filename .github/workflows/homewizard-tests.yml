name: HomeWizard Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: |
          uv pip install \
            -e . \
            -r requirements_all.txt \
            -r requirements_test.txt \
            colorlog \
            --config-settings editable_mode=compat

      - name: Generate all translations
        run: |
          .venv/bin/python -m script.translations develop --all

      - name: Run HomeWizard tests
        run: |
          .venv/bin/python -m pytest -q tests/components/homewizard

      - name: Install Ruff
        run: uv pip install ruff

      - name: Check HomeWizard code quality
        run: |
          .venv/bin/ruff check \
            homeassistant/components/homewizard/const.py \
            homeassistant/components/homewizard/config_flow.py \
            homeassistant/components/homewizard/coordinator.py \
            homeassistant/components/homewizard/__init__.py \
            tests/components/homewizard/test_config_flow.py \
            tests/components/homewizard/test_init.py

          .venv/bin/ruff format --check \
            homeassistant/components/homewizard/const.py \
            homeassistant/components/homewizard/config_flow.py \
            homeassistant/components/homewizard/coordinator.py \
            homeassistant/components/homewizard/__init__.py \
            tests/components/homewizard/test_config_flow.py \
            tests/components/homewizard/test_init.py
          
