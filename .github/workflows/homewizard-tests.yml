name: HomeWizard Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: |
          uv pip install \
            -e . \
            -r requirements_all.txt \
            -r requirements_test.txt \
            colorlog \
            --config-settings editable_mode=compat

      - name: Generate HomeWizard translations
        run: |
          .venv/bin/python -m script.translations develop --integration homewizard

      - name: Run HomeWizard tests
        run: |
          .venv/bin/python -m pytest -q tests/components/homewizard/
