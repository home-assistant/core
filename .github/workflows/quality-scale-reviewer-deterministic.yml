name: Quality scale reviewer (deterministic)

# Stage 1 of the Quality scale reviewer pipeline.
#
# Collects the pull request metadata and diff, the touched integration domains
# that have a quality_scale.yaml, and the Integration Quality Scale rules index
# and documentation, then uploads them as an artifact. Stage 2 (the agentic
# workflow defined in `quality-scale-reviewer.md`) consumes the artifact on
# completion.
#
# The pull request is read through the API and never checked out; the checkout
# is the default branch, so the script runs from there, not from the pull
# request. The workflow file itself is still the pull request's, as for any
# `pull_request` event. A change to the script is therefore tried out by
# dispatching this workflow from a branch.

# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches-ignore:
      - master
    paths:
      - "homeassistant/components/**"
      - "tests/components/**"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request number to (re-)review"
        required: true
        type: number

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pull_request_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Collect pull request data and quality scale rules
    # Draft pull requests are reviewed once they are marked ready for review.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # To fetch the PR metadata and diff
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: true
      - name: Install script dependencies
        run: pip install -r script/quality_scale_review/requirements.txt
      - name: Collect pull request data and quality scale rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
        run: |
          python -m script.quality_scale_review \
            --pr-number "${PR_NUMBER}" \
            --output deterministic
      - name: Upload deterministic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-scale-reviewer-deterministic
          path: deterministic
          if-no-files-found: error
          retention-days: 7
