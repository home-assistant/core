name: PR reviewer (trigger)
run-name: "#${{ github.event.pull_request.number }}"

# Stage 1 of the PR reviewer pipeline.
#
# This workflow exists only to trigger stage 2 (the agentic workflow defined in
# `pr-reviewer.md`) through `workflow_run`: a `pull_request` run from a fork gets
# no secrets. It runs the pull request's own copy of this file with no
# permissions, so nothing it does is trusted: stage 2 checks the pull request
# number in the run name against the run's head commit.

# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - dev

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trigger:
    name: Trigger the PR review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "Triggering the review of pull request ${PR_NUMBER}"
