name: Search integration regression tests (issue 194159)

on:
  push:
    branches:
      - fix/194159-search-related-registry-ids
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-integration:
    name: Search integration pytest
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
      - name: Set up Home Assistant test environment
        uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: "3.14.10"
          uv-version: "0.13.8"
          python-cache-key: "search-issue-194159"
          uv-cache-dir: /tmp/uv-cache
          apt-cache-version: "2"
      - name: Generate development translations
        shell: bash
        run: |
          . venv/bin/activate
          python -m script.translations develop --all
      - name: Run registry ID regressions
        shell: bash
        run: |
          . venv/bin/activate
          python -m pytest -q tests/components/search/test_init.py -k test_search_related_resolves_entity_registry_ids --no-cov -o addopts=""
      - name: Run full Search integration test file
        shell: bash
        run: |
          . venv/bin/activate
          python -m pytest -q tests/components/search/test_init.py --no-cov -o addopts=""
