name: Shelly Remote Development

"on":
  push:
    branches:
      - feature/remote-websocket-transport
    paths:
      - homeassistant/components/shelly/**
      - tests/components/shelly/**
      - .github/workflows/shelly-remote-dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shelly-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shelly:
    name: Shelly remote integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: drHouse-gif/aioshelly
          ref: 74751fcb876cc5fbd993721da765d40cd5b5b750
          path: aioshelly
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Install Core test dependencies
        run: |
          uv venv --python 3.14
          uv pip install --python .venv/bin/python -e . -r requirements_test.txt --config-settings editable_mode=compat
          uv pip install --python .venv/bin/python colorlog dacite numpy av
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          domains = ("camera", "frontend", "hassio", "infrared", "mqtt", "shelly", "switchbot", "usb")
          requirements = [
              requirement
              for domain in domains
              for requirement in json.loads(Path(f"homeassistant/components/{domain}/manifest.json").read_text()).get("requirements", [])
          ]
          subprocess.run(["uv", "pip", "install", "--python", ".venv/bin/python", *requirements], check=True)
          PY
          uv pip install --python .venv/bin/python -e ../aioshelly --config-settings editable_mode=compat
      - name: Generate translations
        run: uv run --no-sync python -m script.translations develop --all
      - name: Ruff
        run: |
          uv run --no-sync ruff format --check homeassistant/components/shelly tests/components/shelly
          uv run --no-sync ruff check homeassistant/components/shelly tests/components/shelly
      - name: Mypy
        run: uv run --no-sync mypy homeassistant/components/shelly
      - name: Pylint
        run: uv run --no-sync pylint --ignore-missing-annotations=y homeassistant/components/shelly tests/components/shelly
      - name: Hassfest
        run: uv run --no-sync python -m script.hassfest --integration-path homeassistant/components/shelly
      - name: Complete Shelly suite
        run: uv run --no-sync pytest -q tests/components/shelly
