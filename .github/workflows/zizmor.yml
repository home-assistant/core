name: Zizmor GitHub Actions security analysis

# Pull requests run the strict offline hook; accepted branches publish online
# findings to GitHub Code Scanning.

"on":
  push:
    branches:
      - dev
      - rc
      - master
  pull_request: ~
  schedule:
    # Weekly re-scan (Mondays 05:30 UTC) so the code scanning results stay fresh.
    - cron: "30 5 * * 1"
  workflow_dispatch: ~

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Check GitHub Actions workflows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # To check out the pull request merge commit
      pull-requests: read # To list files changed by the pull request
    steps:
      - name: Check for relevant changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - '**/.github/{workflows/*,dependabot}.{yml,yaml}'
              - '**/{action,.pre-commit-{config,hooks}}.{yml,yaml}'
              - '{.github/,}zizmor.{yml,yaml}'

      - name: Check out code from GitHub
        if: steps.changes.outputs.relevant == 'true' || github.event.pull_request.changed_files >= 3000
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor
        if: steps.changes.outputs.relevant == 'true' || github.event.pull_request.changed_files >= 3000
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --all-files zizmor

      - name: Skip scan for unrelated pull request
        if: steps.changes.outputs.relevant == 'false' && github.event.pull_request.changed_files < 3000
        run: echo "No GitHub Actions security-related files changed."

  report:
    name: Scan accepted ${{ matrix.branch }} GitHub Actions
    if: >-
      github.repository_owner == 'home-assistant' &&
      contains(fromJSON('["refs/heads/dev","refs/heads/rc","refs/heads/master"]'), github.ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'push' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON('["dev","rc","master"]') }}
    permissions:
      contents: read # To scan the accepted branch commit
    steps:
      - name: Check out accepted branch commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || matrix.branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: requirements.txt

      - name: Generate accepted-code SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          expected="zizmor $(grep -oP '^zizmor==\K.*' requirements_test_pre_commit.txt)"
          actual="$(uvx --constraints requirements_test_pre_commit.txt zizmor --version)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Expected '${expected}', got '${actual}'."
            exit 1
          fi
          uvx --constraints requirements_test_pre_commit.txt zizmor \
            --pedantic --collect=all --strict-collection --no-exit-codes \
            --no-progress --format=sarif . > zizmor.sarif
          printf '%s\n' "${SCAN_SHA}" > sha.txt

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-sarif-${{ matrix.branch }}
          path: |
            zizmor.sarif
            sha.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  upload:
    name: Upload accepted ${{ matrix.branch }} GitHub Actions findings
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'push' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON('["dev","rc","master"]') }}
    permissions:
      actions: read # To download the same-run SARIF artifact
      contents: read # To check out the scanned commit for fingerprinting
      security-events: write # To upload accepted-code findings
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zizmor-sarif-${{ matrix.branch }}

      - name: Read scanned commit
        id: sha
        run: echo "sha=$(cat sha.txt)" >> "${GITHUB_OUTPUT}"

      - name: Check out scanned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
          path: src

      - name: Upload accepted-code SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor
          checkout_path: ${{ github.workspace }}/src
          ref: refs/heads/${{ matrix.branch }}
          sha: ${{ steps.sha.outputs.sha }}
