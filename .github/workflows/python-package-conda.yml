## 2. `conda-lock` for full reproducibility

`environment.yml` alone has **no lockfile** — two `conda env create` runs a week apart can resolve to different versions. `conda-lock` produces a fully-pinned, cross-platform lockfile.

### Install and generate the lock

```bash
# One-time, local
pip install conda-lock

# Generate lock for the platforms you CI on
conda-lock lock \
  --file environment.yml \
  --kind explicit \
  --platform linux-64 \
  --platform osx-64 \
  --platform osx-arm64 \
  --platform win-64
```

This produces:
```
conda-lock.yml           # unified lock (recommended)
conda-linux-64.lock      # explicit per-platform (if --kind explicit)
conda-osx-64.lock
conda-osx-arm64.lock
conda-win-64.lock
```

### Updated workflow using the lock

```yaml
name: Python Package using Conda

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Conda (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    defaults:
      run:
        shell: bash -el {0 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          activate-environment: myenv
          use-mamba: true
          auto-activate-base: false

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('conda-lock.yml') }}
          restore-keys: |
            conda-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install conda-lock
        run: pip install conda-lock

      - name: Create env from lockfile
        run: |
          conda-lock install \
            --conda $(which conda) \
            --name myenv \
            conda-lock.yml
          conda activate myenv

      - name: Verify environment
        run: |
          conda info
          conda list
          python --version

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
```

### The Python-version matrix and locks conflict

Notice a subtlety: **`conda-lock.yml` pins `python=3.10` explicitly** if that's what's in `environment.yml`. You can't reuse one lock across 3.10/3.11/3.12.

Two options:

**Option A — drop the matrix.** Lock to one Python version. Simple, reproducible, boring. This is what most scientific projects do.

**Option B — one lock per Python version.**
```bash
for v in 3.10 3.11 3.12; do
  sed "s/python=.*/python=$v/" environment.yml > environment-$v.yml
  conda-lock lock --file environment-$v.yml -k explicit --platform linux-64
  mv conda-lock.yml conda-lock-$v.yml
done
```

Then in CI: `conda-lock install --name myenv conda-lock-${{ matrix.python-version }}.yml`.

Option A is what I'd recommend unless you actively support multiple Python versions.

### Commit the lock

**Yes, commit `conda-lock.yml`.** It's the entire point — it's the reproducible artifact. Add `conda-lock.yml linguist-generated=true` to `.gitattributes` if you don't want it counted in repo stats.

### Regenerate on dep changes

Add a CI job that fails if the lock is out of date relative to `environment.yml`:

```yaml
  lock-check:
    name: Lockfile up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
      - run: pip install conda-lock
      - run: |
          conda-lock lock --file environment.yml --kind explicit --platform linux-64
          git diff --exit-code conda-lock.yml || \
            (echo "::error::conda-lock.yml is out of date. Run 'conda-lock lock' and commit." && exit 1)
```

Or add a `pre-commit` hook that runs `conda-lock` on `environment.yml` changes.

