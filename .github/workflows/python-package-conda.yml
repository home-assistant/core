## Summary of what you now have

| Artifact | Purpose |
|---|---|
| `python-app.yml` (pip) | Main CI, hybrid OS/Python matrix |
| `python-app.yml` (conda) | Same, but Miniforge + `environment.yml` |
| `environment.yml` | Conda dep manifest |
| `conda-lock.yml` | Fully pinned, cross-platform conda lock |
| `nightly.yml` (conda) | Daily CVE scan via safety + freshness via `conda update --all` |
| Pip-only alternative | Uses `setup-python` + uv for speed |
| HTML reference | Now includes both variants with a decision matrix |

**Pick one path and delete the other.** Maintaining both conda and pip in the same repo doubles the surface area and nobody remembers which is canonical six months later. The decision matrix is the tiebreaker — if you're not sure, you're a pip project.
