dependencies:
  - python=3.10       # overridden by matrix at runtime
  - pip
  # runtime deps go here
  - flake8
  - pytest
  - pytest-cov
  - pip:
      - codecov</code></pre>

<h3>Conda with conda-lock (fully reproducible)</h3>
<p>Generate locally once, commit the lock, install from it in CI:</p>
<pre><code># generate
conda-lock lock --file environment.yml --kind explicit \
  --platform linux-64 --platform osx-64 \
  --platform osx-arm64 --platform win-64

# CI installs from the lock
conda-lock install --conda $(which conda) --name myenv conda-lock.yml</code></pre>

<div class="callout">
  <strong>Lock + Python matrix conflict.</strong> A single <code>conda-lock.yml</code> pins one Python version. Either drop the matrix (common for scientific projects) or generate one lock per Python version.
</div>

<h3>Conda gotchas</h3>
<table>
  <thead><tr><th>Trap</th><th>Fix</th></tr></thead>
  <tbody>
    <tr><td><code>$CONDA</code> unset on newer runners</td><td>Use <code>setup-miniconda</code>, not <code>echo $CONDA/bin &gt;&gt; $GITHUB_PATH</code></td></tr>
    <tr><td><code>conda install</code> mid-step re-solves env</td><td>Put everything in <code>environment.yml</code></td></tr>
    <tr><td><code>conda update --all</code> breaks on random days</td><td>Never run it in main CI; only in the nightly freshness job, in a throwaway env</td></tr>
    <tr><td>pip clobbers conda packages</td><td>Install conda deps first, pip last (use the <code>pip:</code> sub-block)</td></tr>
    <tr><td>Updating <code>base</code> env</td><td>Always create a named env</td></tr>
    <tr><td>Anaconda <code>defaults</code> channel licensing</td><td>Use <code>conda-forge</code> via Miniforge</td></tr>
    <tr><td>Slow solver</td><td><code>use-mamba: true</code></td></tr>
    <tr><td>No lockfile in <code>environment.yml</code></td><td>Use <code>conda-lock</code></td></tr>
  </tbody>
</table>

<!-- ======================= PIP VS CONDA ======================= -->
<h2 class="section" id="pip-vs-conda">Pip vs Conda — Decision Matrix</h2>
<table>
  <thead><tr><th>Criterion</th><th>Conda</th><th>pip</th></tr></thead>
  <tbody>
    <tr><td>Non-Python binaries (GDAL, HDF5, MKL)</td><td style="color:var(--ok)">✅ native</td><td style="color:var(--warn)">⚠️ needs system libs</td></tr>
    <tr><td>GPU (CUDA) builds</td><td style="color:var(--ok)">✅ first-class</td><td style="color:var(--warn)">⚠️ wheels for common cases</td></tr>
    <tr><td>Solver speed</td><td>fast with mamba</td><td>very fast with uv</td></tr>
    <tr><td>CI startup time</td><td>30–90s</td><td>5–15s</td></tr>
    <tr><td>Cache simplicity</td><td>per-Python-version, per-OS</td><td>one cache, one key</td></tr>
    <tr><td>Lockfile ecosystem</td><td>conda-lock (complex)</td><td>pip-tools / uv (mature)</td></tr>
    <tr><td>Pure-Python library</td><td style="color:var(--err)">❌ overkill</td><td style="color:var(--ok)">✅ pick this</td></tr>
    <tr><td>Scientific stack</td><td style="color:var(--ok)">✅ pick this</td><td style="color:var(--warn)">⚠️ breaks on some</td></tr>
  </tbody>
</table>

<div class="callout ok">
  <strong>Rule of thumb:</strong> if you have to ask, you don't need conda. Reach for it when a specific package only works via conda-forge.
</div>

<h3>Pip-only with uv (modern)</h3>
<span class="filename">.github/workflows/python-app.yml — pip variant</span>
<pre><code>      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - run: uv pip install --system -r requirements.txt -r requirements-dev.txt</code></pre>
```

