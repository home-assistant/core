## 1. `nightly.yml` for Conda

Replaces `pip-audit` (which doesn't understand conda-managed packages) with conda-appropriate tooling. Freshness test uses `conda update --all` in a throwaway env so it can't poison the runner's base.

```yaml
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"     # 03:17 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # ----------------------------------------------------------------------
  # Dependency audit: scan the *current* environment for known CVEs.
  # ----------------------------------------------------------------------
  dependency-audit:
    name: Nightly — dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: myenv
          use-mamba: true
          auto-activate-base: false

      - name: Export explicit package list
        run: |
          conda list --explicit > conda-explicit.txt
          conda list --json > conda-list.json

      - name: Install safety (CVE scanner)
        run: pip install safety pip-audit

      - name: pip-audit — CVE scan of pip-installed packages
        run: pip-audit --strict --desc on || true

      - name: safety — CVE scan across the whole env
        run: |
          # safety reads requirements-style files; conda's explicit list works.
          safety check --file conda-explicit.txt --full-report --continue-on-error || true

      - name: Upload environment snapshot
        uses: actions/upload-artifact@v4
        with:
          name: conda-env-${{ github.run_id }}
          path: |
            conda-explicit.txt
            conda-list.json

  # ----------------------------------------------------------------------
  # Freshness: install latest allowed deps in a *throwaway* env.
  # ----------------------------------------------------------------------
  freshness-test:
    name: Nightly — latest allowed deps
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          # Note: no environment-file — we clone and then update.
          activate-environment: fresh
          use-mamba: true
          auto-activate-base: false

      - name: Clone env, then update to latest allowed
        run: |
          conda env create -n fresh -f environment.yml
          conda activate fresh
          conda update --all --yes
          conda list

      - name: Install pytest
        run: pip install pytest

      - name: Test
        run: pytest -q

  notify:
    name: Nightly — notify
    needs: [dependency-audit, freshness-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly build failing";
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "nightly-failure",
            });
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                labels: ["nightly-failure"],
              });
            }
```

### Why the tooling changed

| Tool | pip world | conda world |
|---|---|---|
| CVE scan | `pip-audit` | `safety` reads the explicit env list; `pip-audit` still works for the pip-installed subset |
| Freshness | `pip install --upgrade -r requirements.txt` | `conda update --all` in a cloned env |
| Env dump | `pip freeze` | `conda list --explicit` (pins URLs + hashes) |

`conda-audit` (the conda-native scanner) is still experimental and unmaintained as of 2025 — `safety` against `conda list --explicit` is the pragmatic choice.

`safety check --continue-on-error` is deliberate: we want the report in the log but don't want a single transitive CVE to page someone at 3am. Swap to `--fail-on any` (or drop the flag) once you're clean and want the gate.

