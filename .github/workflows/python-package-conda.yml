name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      run: |
        conda install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        conda install pytest
        pytest
This is the **starter workflow GitHub generates for Conda projects**. It has the same problems as your original `python-app.yml`, plus a few Conda-specific ones. Here's the review and an improved version.

## Issues in the original

| # | Issue | Why it matters |
|---|---|---|
| 1 | `on: [push]` | Runs on every branch, every push. No PR trigger, no branch filter. |
| 2 | `max-parallel: 5` | Meaningless — there's no matrix, only one job. |
| 3 | `actions/setup-python@v3` | Outdated (Node 16, EOL). And it's **pointless here** — you're using conda, not system Python. |
| 4 | `echo $CONDA/bin >> $GITHUB_PATH` | `$CONDA` is not reliably set on `ubuntu-latest` images anymore. The whole step is unnecessary if you use `setup-miniconda`. |
| 5 | `conda env update --name base` | Updating `base` is discouraged. Create a named env; isolation matters. |
| 6 | `conda install flake8` / `conda install pytest` **inside steps** | Slow, unpinned, re-solves the environment mid-run, and not reproducible. Deps belong in `environment.yml`. |
| 7 | No caching | Conda re-downloads the whole world every run. |
| 8 | No Python matrix | Locks you to 3.10 forever. |
| 9 | No `permissions:` block | Uses default token permissions (broader than needed). |
| 10 | No `concurrency:` | Stale runs pile up on rapid pushes. |
| 11 | Uses `defaults.run.shell` implicitly | On some runners conda activation is needed in every step — better to declare it explicitly. |
| 12 | `pytest` with no args | Fails with "no tests collected" exit code 5 on empty repos. |

## Improved version

```yaml
name: Python Package using Conda

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Conda (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    defaults:
      run:
        shell: bash -el {0}     # -l activates the conda env in every step

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: myenv
          use-mamba: true              # much faster solver
          auto-activate-base: false

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('environment.yml') }}
          restore-keys: |
            conda-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Verify environment
        run: |
          conda info
          conda list
          python --version

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
```

## `environment.yml` — everything lives here

This replaces the inline `conda install flake8` / `conda install pytest` steps.

```yaml
name: myenv

channels:
  - conda-forge

dependencies:
  - python=3.10       # ← overridden by the matrix at runtime
  - pip

  # Runtime deps
  # - numpy
  # - pandas
  # - scipy

  # Dev / test tooling
  - flake8
  - pytest
  - pytest-cov
  - pip:
      - codecov
```

**Why a single `environment.yml` beats inline installs:**

- Reproducible — one source of truth for both CI and local dev (`conda env create -f environment.yml`).
- Faster — one solver pass instead of three.
- Cacheable — the `hashFiles('environment.yml')` key actually invalidates when deps change.
- Auditable — reviewers see what CI is really installing.

## Key changes explained

### `conda-incubator/setup-miniconda@v3`

This is the **official recommended action** for conda on GitHub Actions. It:

- Installs Miniforge (conda-forge only, no licensing concerns with Anaconda's default channels).
- Creates the environment from your `environment.yml` in one step.
- Handles activation correctly — no `echo $CONDA/bin >> $GITHUB_PATH` hack.
- Supports a Python version matrix via the `python-version` input.

If you need the `anaconda` default channels (e.g. for packages only on Anaconda's repo), use `miniconda-version` instead of `miniforge-version` — but check Anaconda's [Terms of Service](https://www.anaconda.com/legal) first, since commercial use of their default channels now requires a paid license.

### `defaults.run.shell: bash -el {0}`

Without this, some steps run before conda activation and see the system Python. The `-el` flags:

- `-e` → exit on error
- `-l` → login shell, which sources `~/.bash_profile` where conda activation lives

This is the difference between "works sometimes" and "works every time."

### `use-mamba: true`

Mamba is a drop-in replacement for the conda solver — same commands, 10–100× faster dependency resolution. On a small environment it's the difference between 90s and 10s. `setup-miniconda@v3` installs it for you.

### Cache key includes `matrix.python-version`

Each Python version needs its own `~/conda_pkgs_dir` — conda packages are built per-Python-version. Omitting this from the key causes subtle "works on 3.10, fails on 3.12" bugs.

## Gotchas specific to Conda

| Trap | Why it bites | Fix |
|---|---|---|
| **`$CONDA` unset** | Newer `ubuntu-latest` images don't export it globally | Use `setup-miniconda` — it handles activation itself |
| **`conda install` mid-step** | Re-solves the whole env; can silently upgrade other packages | Put everything in `environment.yml` |
| **`conda update --all`** | Non-deterministic; breaks on random days | Never run it in CI |
| **Mixing pip and conda carelessly** | pip can clobber conda packages; order matters | Install conda deps first, pip last (as shown in the `pip:` sub-block) |
| **`base` env updates** | Pollutes the runner's base env; some packages may not upgrade cleanly | Always create a named env |
| **Anaconda defaults licensing** | Commercial use of `defaults` channel requires a paid plan since 2024 | Use `conda-forge` via Miniforge |
| **Slow solver** | The classic solver is O(exponential) in dep count | `use-mamba: true` |
| **Lockfiles** | `environment.yml` has no lock — two runs can resolve differently | For reproducibility, use `conda-lock` and commit `conda-lock.yml` |

## When to use Conda vs pip

You're using Conda — presumably for scientific packages. Worth asking whether you *need* it:

**Conda wins when:**
- You need **non-Python binaries** (GDAL, HDF5, MKL, CUDA, R, compiled Fortran).
- You're working in a science/data stack where conda-forge is the canonical distribution.
- You need GPU builds (`pytorch-gpu`, `tensorflow-gpu`) that pip wheels don't cover well.

**pip wins when:**
- You're a pure-Python library.
- You want faster CI and simpler caching.
- All your deps have wheels on PyPI.

If you can drop Conda, the plain `python-app.yml` from earlier in this thread is faster, simpler, and doesn't require the `setup-miniconda` action or the `environment.yml` file.

## Full picture if you keep Conda

```
.
├── .github/
│   └── workflows/
│       └── python-app.yml       # ← the improved Conda workflow above
├── environment.yml              # single source of truth for deps
├── pyproject.toml               # coverage + pytest config
└── src/your_package/
```

You can still add everything else from earlier in this thread — nightly audit, publish to PyPI, Dependabot, pre-commit, branch protection. The only difference is the conda-specific env setup in the test job. `pip-audit` won't work well on conda-managed envs, so for security scanning use `conda list --explicit` + [safety](https://pypi.org/project/safety/) or [conda-audit](https://github.com/conda/conda-audit) instead.

