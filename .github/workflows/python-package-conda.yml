## 3. Pip-only alternative

If you don't actually need conda's non-Python binaries (GDAL, MKL, CUDA, R, etc.), the pip path is simpler and faster. Same coverage, no `setup-miniconda`, no `environment.yml`, no lockfile tooling.

```yaml
name: Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Test with pytest
        shell: bash
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
```

### Pip-only with a lockfile

For reproducibility without conda-lock, use **pip-tools** (classic) or **uv** (modern, much faster).

**pip-tools:**
```bash
pip install pip-tools
pip-compile requirements.in -o requirements.txt
pip-compile requirements-dev.in -o requirements-dev.txt
```
CI installs from `requirements.txt` (fully pinned). Regenerate and commit on change.

**uv (recommended in 2025):**
```bash
uv pip compile requirements.in -o requirements.txt
```
And in the workflow:
```yaml
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - run: uv pip install --system -r requirements.txt -r requirements-dev.txt
```

uv is 10–100× faster than pip for both install and resolve, and it works with `requirements.txt` — no ecosystem migration required.

### Decision matrix

| Criterion | Conda | pip |
|---|---|---|
| Non-Python binaries (GDAL, HDF5, MKL) | ✅ native | ⚠️ needs system libs, often broken |
| GPU (CUDA) builds | ✅ first-class | ⚠️ wheels exist for common cases |
| Solver speed | fast with mamba | very fast with uv |
| CI startup time | 30–90s | 5–15s |
| Cache simplicity | per-Python-version, per-OS | one cache, one key |
| Lockfile ecosystem | conda-lock (complex) | pip-tools / uv (mature) |
| Cross-platform parity | good | good with wheels |
| **Pure-Python library** | ❌ overkill | ✅ pick this |
| **Scientific stack** | ✅ pick this | ⚠️ works for most, breaks on some |

**Rule of thumb:** if you have to ask, you don't need conda. Reach for it when you hit a specific package that only conda-forge distributes in working form.

