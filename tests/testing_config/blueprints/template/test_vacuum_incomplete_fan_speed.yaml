blueprint:
  name: Test vacuum with incomplete fan speed options
  description: Creates a vacuum with fan speeds but no set fan speed action
  domain: template
  input:
    sensor:
      name: Sensor Entity
      description: The sensor entity
      selector:
        entity:
          domain: sensor
    fan_speeds:
      name: Fan speeds
      description: The fan speeds of the vacuum
      selector:
        text:
          multiple: true
variables:
  sensor: !input sensor
vacuum:
  state: "{{ states(sensor) }}"
  start: []
  fan_speed: "{{ 'high' }}"
  fan_speeds: !input fan_speeds
