blueprint:
  name: Test vacuum with incomplete fan speed options
  description: Creates a vacuum with a set fan speed action but no fan speeds
  domain: template
  input:
    sensor:
      name: Sensor Entity
      description: The sensor entity
      selector:
        entity:
          domain: sensor
variables:
  sensor: !input sensor
vacuum:
  state: "{{ states(sensor) }}"
  start: []
  set_fan_speed: []
