# Experimental harness; the host does not implement the socket-listener options yet.

services:
  main:
    image: homeassistant/home-assistant:dev
    volumes:
      - sandbox_sock:/shared
    environment:
      SANDBOX_TRANSPORT: unix
      SANDBOX_SOCKET_PATH: /shared/sandbox.sock
    depends_on:
      - sandbox

  sandbox:
    build:
      context: ../..
      dockerfile: packages/home-assistant-sandbox/Dockerfile
    init: true
    volumes:
      - sandbox_sock:/shared
    environment:
      SANDBOX_NAME: built-in
      SANDBOX_URL: unix:///shared/sandbox.sock
      SANDBOX_LOG_LEVEL: INFO

volumes:
  sandbox_sock:
