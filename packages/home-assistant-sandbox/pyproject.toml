[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-sandbox"
version = "0.1.0"
description = "Worker runtime for Home Assistant Sandbox."
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "Apache-2.0" }
authors = [{ name = "Paulus Schoutsen" }]
dependencies = [
  "aiohttp>=3.11.0",
  "homeassistant",
  "protobuf==7.36.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.3.0",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["homeassistant_sandbox*"]

[tool.setuptools.package-data]
homeassistant_sandbox = ["py.typed"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
homeassistant = { path = "../..", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
